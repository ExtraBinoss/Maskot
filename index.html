<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfd" />
    <style>
      :root {
        color-scheme: light dark;
        background: #fbfbfd;
        color: #1d1d1f;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          background: #1c1c1e;
          color: #f5f5f7;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #1c1c1e;
        color: #f5f5f7;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        background: #fbfbfd;
        color: #1d1d1f;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      (() => {
        let preference;
        try {
          preference = JSON.parse(localStorage.getItem("mascotlab-theme"));
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1c1c1e"
          : "#fbfbfd";
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <aside
        style="
          max-width: 560px;
          margin: 12vh auto;
          padding: 32px;
          font:
            18px/1.6 system-ui,
            sans-serif;
        "
      >
        <img
          src="/favicon.svg"
          width="72"
          height="72"
          alt="Maskot’s orange mascot"
        />
        <p>
          Enable JavaScript to open the free character studio. Your creations
          are saved in your browser.
        </p>
        <p>
          <a href="https://github.com/ExtraBinoss/Maskot"
            >Explore the open-source project</a
          >
          · <a href="https://plinka.eu/">Made by Plinka</a>
        </p>
      </aside>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
